[metadata]
description-file = README.md
license_files = LICENSE

[tool:pytest]
addopts =
  --cov=fugue_sql_antlr
  --cov-report=term-missing:skip-covered
  -vvv

[coverage:run]
omit =
  fugue_sql_antlr/_parser/*
  fugue_sql_antlr_cpp/*

[mypy-fugue_sql_antlr._parser.*]
ignore_errors = True

[mypy-fugue_sql_cpp.*]
ignore_errors = True
